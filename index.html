<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Studio: Siege (R-Respawn & Safety Plate)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --ui-bg: rgba(15, 15, 15, 0.9); --ui-border: #333; --accent: #2e7d32; --text: #ccc; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111; color: var(--text); user-select: none; }
        
        #hud {
            position: absolute; top: 10px; left: 10px; width: 200px;
            background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 8px;
            padding: 12px; z-index: 100; font-size: 11px;
        }
        #game-stats {
            position: absolute; top: 10px; left: 230px; right: 10px; 
            display: flex; justify-content: space-between; pointer-events: none; z-index: 90;
        }
        .hp-bar { font-size: 14px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; color: #ff5252; }
        #countdown-timer { font-size: 32px; color: #ffd54f; font-weight: bold; }

        #respawn-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 200; display: none; text-align: center;
        }
        .respawn-btn {
            background: #d32f2f; color: white; border: none; padding: 15px 30px;
            font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold;
            box-shadow: 0 0 15px rgba(211, 47, 47, 0.4);
        }
        .respawn-hint { display: block; margin-top: 10px; font-size: 12px; color: #888; }

        .section-label { font-size: 9px; text-transform: uppercase; color: #666; margin: 8px 0 4px; display: block; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .id-container { background: #000; padding: 5px; display: flex; justify-content: space-between; margin-bottom: 5px; border-radius: 4px; }
        #my-id-display { font-family: monospace; font-size: 9px; color: #4caf50; overflow: hidden; }
        .copy-btn { background: #333; color: white; border: none; padding: 2px 5px; border-radius: 3px; font-size: 8px; cursor: pointer; }
        .btn { background: #222; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px; cursor: pointer; font-size: 10px; }
        .btn.active { background: var(--accent); }
        #peer-id-input { background: #000; border: 1px solid #444; color: white; padding: 4px; width: 60%; font-size: 10px; }
        
        canvas { display: block; background: #0a0f1e; cursor: crosshair; }
        .char-btn { font-size: 16px; padding: 5px; background: #111; border: 1px solid #444; border-radius: 5px; cursor: pointer; }
        .char-btn.selected { border-color: #ffd54f; background: #222; }
    </style>
</head>
<body>

<div id="game-stats">
    <div id="p1-health" class="hp-bar">🐱 ❤️10</div>
    <div id="countdown-timer"></div>
    <div id="p2-health" class="hp-bar">🐶 ❤️10</div>
</div>

<div id="respawn-overlay">
    <button class="respawn-btn" onclick="respawnPlayer()">RESPAWN</button>
    <span class="respawn-hint">Or press 'R'</span>
</div>

<div id="hud">
    <span class="section-label">Connection</span>
    <div class="id-container">
        <span id="my-id-display">Generating...</span>
        <button class="copy-btn" onclick="copyMyId()">COPY</button>
    </div>
    <div style="display:flex; gap:3px;">
        <input type="text" id="peer-id-input" placeholder="Andrey's ID">
        <button class="btn" onclick="connectToPeer()">LINK</button>
    </div>

    <span class="section-label">Character</span>
    <div style="display:flex; gap:5px;">
        <button class="char-btn" id="btn-cat" onclick="selectChar('🐱')">🐱</button>
        <button class="char-btn" id="btn-dog" onclick="selectChar('🐶')">🐶</button>
    </div>

    <span class="section-label">Controls</span>
    <div style="font-size: 9px; color: #888; margin-bottom: 5px;">G: Shoot | R: Respawn | Space: Jump</div>
    <div class="grid-3" style="grid-template-columns: 1fr 1fr;">
        <button id="pourBtn" class="btn active" onclick="setTool('pour')">POUR</button>
        <button id="digBtn" class="btn" onclick="setTool('dig')">DIG</button>
    </div>
    <button class="btn" style="width:100%; margin-top:5px; background:#822;" onclick="startShowdown()">FIGHT</button>

    <span class="section-label">Elements</span>
    <div class="grid-3">
        <button class="btn" onclick="setElement('earth')">Dirt</button>
        <button class="btn" onclick="setElement('mountain')">Stone</button>
        <button class="btn" onclick="setElement('sand')">Sand</button>
        <button class="btn" onclick="setElement('lava')">Lava</button>
        <button class="btn" onclick="setElement('fire')">Fire</button>
        <button class="btn" onclick="setElement('water')">Water</button>
    </div>
    <button class="btn" style="width:100%; margin-top:10px; opacity:0.5;" onclick="resetCanvas()">Purge World</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const colors = { earth: ['#5d4037'], mountain: ['#455a64'], sand: ['#ffc107'], lava: ['#e64a19'], fire: ['#ff5722'], water: ['#0288d1'] };

    let width = 200, grid, cellSize, height, bullets = [];
    let currentElement = 'earth', currentTool = 'pour', peer, conn, myId = "";
    let gunPickup = { x: -100, y: -100, active: false };

    let player = { x: 100, y: 100, vx: 0, vy: 0, char: '🐱', jumps: 0, h: 20, hp: 10, hasGun: false, dir: 1 };
    let partner = { x: -100, y: -100, char: '🐶', h: 20, hp: 10, hasGun: false, dir: 1 };
    const keys = {};

    function setup() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        cellSize = canvas.width / width; height = Math.floor(canvas.height / cellSize);
        grid = Array.from({ length: width }, () => new Array(height).fill(0));
    }

    function selectChar(c) {
        player.char = c;
        document.getElementById('btn-cat').classList.toggle('selected', c === '🐱');
        document.getElementById('btn-dog').classList.toggle('selected', c === '🐶');
        if(conn) conn.send({type: 'char_sync', char: c});
    }

    function createSafetyPlatform(px, py) {
        let gx = Math.floor(px / cellSize);
        let gy = Math.floor((py + 22) / cellSize);
        for(let i = -2; i <= 2; i++) {
            if(grid[gx+i] && gy < height) {
                grid[gx+i][gy] = colors.mountain[0];
                if(conn) conn.send({type: 'grid', x: gx+i, y: gy, v: colors.mountain[0]});
            }
        }
    }

    function respawnPlayer() {
        player.hp = 10; 
        player.x = Math.random() * (canvas.width - 200) + 100; 
        player.y = 100;
        player.vx = 0; player.vy = 0; player.hasGun = false;
        
        // Spawn stone platform so we don't fall forever
        createSafetyPlatform(player.x, player.y);
        
        document.getElementById('respawn-overlay').style.display = 'none';
        if(conn) conn.send({type: 'respawn_sync', char: player.char, x: player.x, y: player.y});
    }

    function startShowdown() {
        let count = 3;
        const timer = setInterval(() => {
            document.getElementById('countdown-timer').innerText = count;
            if (count-- <= 0) {
                clearInterval(timer);
                document.getElementById('countdown-timer').innerText = "";
                spawnGun();
            }
        }, 1000);
        if(conn) conn.send({type: 'start_game'});
    }

    function spawnGun() {
        gunPickup = { x: Math.random() * (canvas.width - 100) + 50, y: 50, active: true };
        if(conn) conn.send({type: 'spawn_gun', x: gunPickup.x, y: gunPickup.y});
    }

    function shoot() {
        if (!player.hasGun || player.hp <= 0) return;
        const b = { x: player.x + (player.dir * 15), y: player.y + 10, vx: player.dir * 15, owner: 'me' };
        bullets.push(b);
        if(conn) conn.send({type: 'shoot', x: b.x, y: b.y, vx: b.vx});
    }

    peer = new Peer();
    peer.on('open', id => { myId = id; document.getElementById('my-id-display').innerText = id; });
    peer.on('connection', c => { conn = c; setupConnHandlers(); });

    function connectToPeer() {
        conn = peer.connect(document.getElementById('peer-id-input').value);
        setupConnHandlers();
    }

    function setupConnHandlers() {
        conn.on('open', () => document.getElementById('my-id-display').style.color = '#4caf50');
        conn.on('data', d => {
            if (d.type === 'grid') { if(grid[d.x]) grid[d.x][d.y] = d.v; }
            if (d.type === 'pos') Object.assign(partner, d);
            if (d.type === 'shoot') bullets.push({x: d.x, y: d.y, vx: d.vx, owner: 'partner'});
            if (d.type === 'gun_taken') { gunPickup.active = false; partner.hasGun = true; }
            if (d.type === 'spawn_gun') gunPickup = {x: d.x, y: d.y, active: true};
            if (d.type === 'hit') player.hp--;
            if (d.type === 'start_game') startShowdown();
            if (d.type === 'respawn_sync') { 
                partner.hp = 10; partner.hasGun = false; partner.char = d.char;
                createSafetyPlatform(d.x, d.y); // Sync the platform spawn
            }
            if (d.type === 'char_sync') partner.char = d.char;
            if (d.type === 'chip') { if(grid[d.x]) grid[d.x][d.y] = 0; }
        });
    }

    window.onkeydown = e => { 
        keys[e.code] = true; 
        if (e.code === 'Space' && player.jumps < 2 && player.hp > 0) { player.vy = -8; player.jumps++; }
        if (e.code === 'KeyG') shoot();
        // NEW CONTROL: R key to respawn
        if (e.code === 'KeyR' && player.hp <= 0) respawnPlayer();
    };
    window.onkeyup = e => keys[e.code] = false;

    function update() {
        for (let x = 0; x < width; x++) {
            for (let y = height - 2; y >= 0; y--) {
                let type = grid[x][y]; if (!type || colors.mountain.includes(type)) continue;
                if (!grid[x][y+1]) { grid[x][y+1] = type; grid[x][y] = 0; }
                else if (x>0 && !grid[x-1][y+1]) { grid[x-1][y+1] = type; grid[x][y] = 0; }
                else if (x<width-1 && !grid[x+1][y+1]) { grid[x+1][y+1] = type; grid[x][y] = 0; }
            }
        }

        if (player.hp > 0) {
            if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -4; player.dir = -1; }
            else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = 4; player.dir = 1; }
            else player.vx *= 0.8;
            
            player.vy += 0.4; player.x += player.vx; player.y += player.vy;
            let gx = Math.floor((player.x + 10) / cellSize), gy = Math.floor((player.y + 20) / cellSize);
            
            if (grid[gx] && (colors.lava.includes(grid[gx][gy]) || colors.fire.includes(grid[gx][gy]))) player.hp = 0;
            if (player.y > canvas.height + 50) player.hp = 0;
            if (gx >= 0 && gx < width && gy >= 0 && gy < height && grid[gx][gy]) { player.y = gy * cellSize - 20; player.vy = 0; player.jumps = 0; }
        } else {
            document.getElementById('respawn-overlay').style.display = 'block';
        }

        bullets.forEach((b, i) => {
            b.x += b.vx;
            let bgx = Math.floor(b.x / cellSize), bgy = Math.floor(b.y / cellSize);
            if (grid[bgx] && grid[bgx][bgy]) {
                grid[bgx][bgy] = 0; if(conn) conn.send({type: 'chip', x: bgx, y: bgy});
                bullets.splice(i, 1); return;
            }
            if (b.owner === 'me' && Math.hypot(b.x - partner.x, b.y - partner.y) < 25 && partner.hp > 0) {
                bullets.splice(i, 1); if(conn) conn.send({type: 'hit'}); partner.hp--;
            }
            if (b.x < 0 || b.x > canvas.width) bullets.splice(i, 1);
        });

        if (gunPickup.active && Math.hypot(player.x - gunPickup.x, player.y - gunPickup.y) < 30) {
            player.hasGun = true; gunPickup.active = false; if(conn) conn.send({type: 'gun_taken'});
        }

        document.getElementById('p1-health').innerText = `${player.char} ❤️${player.hp > 0 ? player.hp : '💀'}`;
        document.getElementById('p2-health').innerText = `${partner.char} ❤️${partner.hp > 0 ? partner.hp : '💀'}`;

        if (conn?.open) conn.send({ type: 'pos', x: player.x, y: player.y, char: player.char, h: player.h, hasGun: player.hasGun, hp: player.hp, dir: player.dir });
    }

    function render() {
        ctx.fillStyle = '#0a0f1e'; ctx.fillRect(0,0,canvas.width,canvas.height);
        for (let x = 0; x < width; x++) {
            for (let y = 0; y < height; y++) {
                if (grid[x][y]) { ctx.fillStyle = grid[x][y]; ctx.fillRect(x*cellSize, y*cellSize, cellSize+1, cellSize+1); }
            }
        }
        if (gunPickup.active) { ctx.font = "24px serif"; ctx.fillText("🔫", gunPickup.x, gunPickup.y); }
        const draw = (p) => {
            if (p.hp <= 0) { ctx.font = "30px serif"; ctx.fillText("💀", p.x, p.y + 10); return; }
            ctx.font = "20px serif"; ctx.save();
            if (p.dir === -1) { ctx.translate(p.x + 20, p.y); ctx.scale(-1, 1); ctx.fillText(p.char, 0, 18); }
            else ctx.fillText(p.char, p.x, p.y + 18);
            ctx.restore();
            if (p.hasGun) ctx.fillText("🔫", p.x + (p.dir * 12), p.y + 14);
        };
        draw(player); draw(partner);
        ctx.fillStyle = "#ffd54f"; bullets.forEach(b => ctx.fillRect(b.x, b.y, 8, 3));
        update(); requestAnimationFrame(render);
    }

    canvas.onmousedown = canvas.onmousemove = e => {
        if(e.buttons !== 1) return;
        let x = Math.floor(e.clientX/cellSize), y = Math.floor(e.clientY/cellSize);
        if(x>=0 && x<width && y>=0 && y<height) {
            let val = currentTool === 'dig' ? 0 : colors[currentElement][0];
            grid[x][y] = val; if(conn) conn.send({type: 'grid', x, y, v: val});
        }
    };
    function resetCanvas() { setup(); }
    function setTool(t) { currentTool = t; document.getElementById('pourBtn').className = t==='pour'?'btn active':'btn'; document.getElementById('digBtn').className = t==='dig'?'btn active':'btn'; }
    function setElement(el) { currentElement = el; setTool('pour'); }
    function copyMyId() { navigator.clipboard.writeText(myId); }
    window.onresize = setup; setup(); render();
</script>
</body>
</html>
